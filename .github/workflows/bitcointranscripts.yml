name: BitcoinTranscripts

on:
  schedule:
    - cron: '0 13 * * 3' # every Wednesday at 1pm UTC
  workflow_dispatch:
  repository_dispatch:
    types:
      - trigger-bitcointranscripts

jobs:
  bitcointranscripts:
    uses: ./.github/workflows/scrape-source.yml
    with:
      source: bitcointranscripts
    secrets: inherit